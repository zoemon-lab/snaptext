# Mac 版と Windows 版を作り、実際に文字が読めるか試験してから、リリース（下書き）に置く。
# ダウンロードページ（site/）は gh-pages に写して公開する。
# GitHub の自動処理の権限で書き込むので、リリースと公開記録に個人のアカウント名は付かない。
name: build-and-release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  mac:
    # macOS 15 と 26 の両方で読めるか試す。配るファイルは macOS 26 で作ったもの（macOS 15 以降で動く）
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (Intel + Apple silicon)
        run: cd mac && ./build.sh
      - name: Self test (read the test images)
        run: mac/SnapText.app/Contents/MacOS/SnapText --selftest testdata/tate.png testdata/yoko.png testdata/mixed.png
      - name: Package
        if: matrix.os == 'macos-26'
        run: |
          mkdir -p out/SnapText-Mac
          ditto mac/SnapText.app out/SnapText-Mac/SnapText.app
          cp "docs/はじめにお読みください（Mac）.txt" out/SnapText-Mac/
          cd out && ditto -c -k --sequesterRsrc --keepParent SnapText-Mac SnapText-Mac.zip
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-26'
        with:
          name: mac
          path: out/SnapText-Mac.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Add Japanese OCR to this test machine
        shell: pwsh
        continue-on-error: true
        run: |
          $cap = Get-WindowsCapability -Online | Where-Object Name -like 'Language.OCR*ja-JP*'
          $cap | Format-Table Name, State
          if ($cap -and $cap.State -ne 'Installed') { Add-WindowsCapability -Online -Name $cap.Name | Out-Null }
          Get-WindowsCapability -Online | Where-Object Name -like 'Language.OCR*' | Format-Table Name, State
      - name: Text-cleanup tests
        run: dotnet run --project windows/tests
      - name: Build
        run: dotnet publish windows/SnapText.csproj -c Release -o dist
      - name: Self test (read the test images)
        shell: pwsh
        run: |
          $imgs = @('tate.png', 'yoko.png', 'mixed.png') | ForEach-Object { Join-Path $PWD "testdata/$_" }
          $p = Start-Process -FilePath dist/SnapText.exe -ArgumentList (@('--selftest', (Join-Path $PWD 'selftest.txt')) + $imgs) -Wait -PassThru
          Get-Content selftest.txt -Encoding utf8
          "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/SnapText-Windows | Out-Null
          Copy-Item dist/SnapText.exe out/SnapText-Windows/
          Copy-Item 'docs/はじめにお読みください（Windows）.txt' out/SnapText-Windows/
          Copy-Item licenses/* out/SnapText-Windows/
          Compress-Archive -Path out/SnapText-Windows -DestinationPath out/SnapText-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/SnapText-Windows.zip

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Put the files in the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(cat VERSION)
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" out/SnapText-Mac.zip out/SnapText-Windows.zip --clobber
          else
            # 下書きで作る。公開は publish.sh release（確認のあと）で行う
            gh release create "v$VER" out/SnapText-Mac.zip out/SnapText-Windows.zip \
              --draft --title "SnapText $VER" --notes-file docs/release-notes.md
          fi
      - name: Publish the download page
        run: |
          rm -rf out
          git config user.name zoemon-lab
          git config user.email zoemon-lab@users.noreply.github.com
          git switch --orphan gh-pages-new
          git checkout main -- site
          git mv site/* .
          git commit -q -m "SnapText のページを公開"
          git push -f origin gh-pages-new:gh-pages
