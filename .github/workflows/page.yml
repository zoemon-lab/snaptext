name: publish-page
on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/page.yml]
permissions:
  contents: write
jobs:
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name zoemonlab
          git config user.email zoemon-lab@users.noreply.github.com
          git switch --orphan page-new
          git checkout main -- site
          git mv site/* .
          git commit -m "zoemonlab: SnapText公開ページ"
          git push -f origin page-new:gh-pages
